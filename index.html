<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Flèche</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon_180.png">
<meta name="theme-color" content="#09090A">
<meta name="apple-mobile-web-app-title" content="La Flèche">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800;1,900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
html.light{--bg:#F3F2EE;--panel:#FFFFFF;--panel2:#ECEBE6;--line:#D9D8D2;--txt:#141416;--mute:#6B6B70;--goldsoft:rgba(255,193,7,.18)}
:root{--bg:#0B0B0C;--panel:#141416;--panel2:#1B1B1E;--line:#2A2A2E;--txt:#F4F4F2;--mute:#8C8C90;--gold:#FFC107;--goldsoft:rgba(255,193,7,.12);--nav:66px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:14px 14px calc(var(--nav) + 14px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
.frame{max-width:720px;margin:0 auto;border:1px solid var(--gold);min-height:calc(100vh - 28px - var(--nav));position:relative;padding:24px 20px 110px;overflow:hidden}
.frame.withadd{padding-bottom:200px}
.tag{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.tag::before{content:"";width:18px;height:3px;background:var(--gold)}
h1{font-family:'Barlow Condensed';font-weight:400;font-size:clamp(42px,10.5vw,70px);line-height:.95;margin-top:20px;text-transform:uppercase}
h1 .g,.g{color:var(--gold)}
.sub{color:var(--mute);font-weight:300;font-size:15px;margin-top:12px;letter-spacing:.03em}
.anton{font-family:'Barlow Condensed';font-weight:400}
.label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.section-label{margin-top:30px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:10px}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}
.section-label b{color:var(--gold);font-weight:500}
.panel{background:var(--panel);border:1px solid var(--line);padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{padding:6px 12px;border:1px solid var(--line);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--goldsoft)}
.btn{padding:10px 15px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line)}
.btn.main{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn.ghost{color:var(--mute)}
.btn.small{padding:6px 10px;font-size:11px}
.btn:disabled{opacity:.4;cursor:default}
.empty{margin-top:24px;padding:26px 18px;border:1px dashed var(--line);color:var(--mute);text-align:center;font-weight:300;line-height:1.6}
.empty b{display:block;font-family:'Barlow Condensed';font-weight:400;font-size:22px;color:var(--txt);margin-bottom:6px;text-transform:uppercase}
.banner{margin-top:16px;padding:10px 12px;border:1px solid var(--gold);color:var(--gold);font-size:13px;display:none}
.banner.show{display:block}

/* QG */
.who{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.who h1{margin-top:14px}
.lvl{text-align:right;margin-top:14px}
.lvl .n{font-family:'Barlow Condensed';font-size:44px;line-height:1}
.lvl .t{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:4px}
.xpbar{margin-top:22px}
.xpbar .bar{height:8px;background:var(--line);margin-top:8px;position:relative;overflow:hidden}
.xpbar .fill{position:absolute;inset:0 auto 0 0;background:var(--gold);transition:width .6s}
.xpbar .row{display:flex;justify-content:space-between}
.overview{display:grid;grid-template-columns:1fr 112px;gap:14px;margin-top:26px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat .h{font-size:12px;text-align:center;color:var(--mute);padding-bottom:4px}
.heat .h.today{color:var(--txt)}
.cell{aspect-ratio:1;background:#18181A}
.cell.l1{background:rgba(255,193,7,.22)}.cell.l2{background:rgba(255,193,7,.55)}.cell.l3{background:var(--gold)}
.cell.off{background:transparent;border:1px dashed var(--mute)}
.cell.fut{background:transparent;border:1px solid #1F1F22}
.cell.today{outline:1.5px solid var(--txt);outline-offset:1px}
.flame{border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.flame svg{width:40px;height:46px}
.flame .n{font-family:'Barlow Condensed';font-size:40px;line-height:1}
.flame .m{font-size:12px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.flame .m b{color:var(--gold);font-weight:500;font-size:18px;display:block;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.kpi{background:var(--panel);border:1px solid var(--line);padding:12px}
.kpi b{display:block;font-family:'Barlow Condensed';font-weight:400;font-size:28px;line-height:1;color:var(--gold)}
.kpi span{display:block;margin-top:7px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
.road{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.stage{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);background:var(--panel)}
.stage .lv{font-family:'Barlow Condensed';width:52px;color:var(--mute)}
.stage .nm{flex:1;text-transform:uppercase;letter-spacing:.1em;font-size:14px;color:var(--mute)}
.stage.done .lv,.stage.done .nm{color:var(--txt)}
.stage.cur{border-color:var(--gold)}.stage.cur .lv,.stage.cur .nm{color:var(--gold)}
.stage .ic{width:16px;height:16px;color:var(--mute)}
.stage.done .ic{color:var(--gold)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.badge{border:1px solid var(--line);padding:12px;background:var(--panel);opacity:.45}
.badge.on{opacity:1;border-color:rgba(255,193,7,.5)}
.badge b{display:block;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.badge.on b{color:var(--gold)}
.badge span{display:block;font-size:12px;color:var(--mute);margin-top:4px;font-weight:300;line-height:1.35}
.xplegend{margin-top:12px;color:var(--mute);font-weight:300;font-size:13px;line-height:1.7}
.xplegend b{color:var(--txt);font-weight:500}

/* habits */
.today-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-top:22px;max-width:500px}
.weeknav button{width:40px;height:36px;font-size:22px;color:var(--mute)}
.weeknav .w{font-family:'Barlow Condensed';font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.hgrid{display:grid;grid-template-columns:minmax(82px,118px) repeat(7,minmax(26px,1fr));gap:8px 5px;align-items:center;margin-top:8px;max-width:500px}
.hgrid>.box{width:100%;max-width:44px;justify-self:center}
.hgrid .dh{text-align:center;font-size:15px;color:var(--mute);padding-bottom:6px;border-bottom:1px solid var(--line)}
.hgrid .dh.today{color:var(--txt);border-bottom:2px solid var(--txt)}
.slot{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;margin-top:22px}
.slot .anton{font-size:28px;text-transform:uppercase}
.slot .c{font-size:12px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.slot .c b{color:var(--gold);font-weight:500}
.hname{font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--txt);text-align:left;line-height:1.15;padding:4px 6px 4px 0;opacity:.85}
.hname small{display:block;font-size:10px;color:var(--gold);letter-spacing:.14em;margin-top:2px}
.box{aspect-ratio:1;border:1.5px solid #3A3A3F;display:grid;place-items:center;transition:.12s}
.box.today{border-color:var(--txt)}
.box.on{background:var(--gold);border-color:var(--gold)}
.box.fut{border-color:#1E1E21;cursor:default}
.box.offd{border-style:dashed}
.box svg{width:60%;height:60%;opacity:0}
.box.on svg{opacity:1}
.addh{grid-column:1/-1;text-align:left;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:6px 0;border-top:1px dashed var(--line);margin-top:4px}

/* tasks/ideas */
.list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:flex-start;gap:14px;background:var(--panel);border:1px solid var(--line);padding:14px}
.row.late{border-left:3px solid var(--gold)}
.check{flex:none;width:24px;height:24px;border:1.5px solid var(--mute);border-radius:50%;display:grid;place-items:center;margin-top:1px}
.row.done .check{background:var(--gold);border-color:var(--gold)}
.check svg{width:13px;height:13px;opacity:0}.row.done .check svg{opacity:1}
.body{flex:1;min-width:0;text-align:left}
.txt{font-size:17px;line-height:1.35;word-wrap:break-word}
.row.done .txt{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--gold)}
.meta{margin-top:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;flex-wrap:wrap;gap:8px}
.meta .hot{color:var(--gold)}
.note{margin-top:6px;font-size:14px;color:var(--mute);font-weight:300;line-height:1.4;white-space:pre-wrap}
.star{flex:none;width:26px;height:26px;display:grid;place-items:center;color:var(--line)}
.star.on{color:var(--gold)}.star svg{width:18px;height:18px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);padding:16px 14px 14px;display:flex;flex-direction:column;gap:10px;position:relative}
.card.fav{border-color:rgba(255,193,7,.5)}
.card .cat{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.card .txt{font-size:16px}
.card .star{position:absolute;top:10px;right:8px}
.status{align-self:flex-start;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line);color:var(--mute)}
.status.s2{color:var(--txt);border-color:var(--mute)}
.status.s3{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.status.s4{color:var(--mute);text-decoration:line-through}
.subtabs{display:flex;gap:6px;margin-top:22px;border-bottom:1px solid var(--line)}
.subtab{padding:10px 12px 9px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.subtab.on{color:var(--txt);border-color:var(--gold)}

/* perfs */
.perfs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.perf{background:var(--panel);border:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.perf .nm{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
.perf .rec{font-family:'Barlow Condensed';font-size:46px;line-height:1;color:var(--gold)}
.perf .rec small{font-family:'Barlow';font-size:14px;color:var(--mute);margin-left:6px;letter-spacing:.08em}
.perf .when{font-size:12px;color:var(--mute);font-weight:300}
.perf svg.spark{width:100%;height:34px}
.perf form{display:flex;gap:6px}
.perf input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);padding:8px;font-size:15px;outline:none}
.perf input:focus{border-color:var(--gold)}
.strava{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.sr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);align-items:baseline;text-decoration:none;color:inherit}
.sr .d{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sr .v{font-family:'Barlow Condensed';font-size:28px;color:var(--gold);text-align:right;grid-row:span 2}
.sr .w{font-size:12px;color:var(--mute);font-weight:300}
.stravahead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}

/* add bar + nav */
.add{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));padding:10px 14px;background:linear-gradient(transparent,var(--bg) 24%);display:none;z-index:4}
.add.show{display:block}
.add-in{max-width:720px;margin:0 auto;background:var(--panel2);border:1px solid var(--line);padding:9px}
.add-row{display:flex;gap:8px}
.add input{flex:1;min-width:0;background:transparent;border:none;outline:none;font-size:17px;padding:8px 6px}
.add input::placeholder{color:var(--mute)}
.plus{flex:none;width:44px;height:44px;background:var(--gold);color:var(--bg);font-family:'Barlow Condensed';font-size:26px}
.add-opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.add-opts .chip{padding:4px 9px;font-size:11px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#0E0E10;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav.bottom .in{display:flex;width:100%;max-width:720px}
nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mute);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--gold)}

/* sheet / overlays */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:10}
.veil.show{display:flex}
.sheet{width:100%;max-width:720px;background:var(--panel);border-top:2px solid var(--gold);padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow:auto}
.sheet h2{font-family:'Barlow Condensed';font-weight:400;font-size:26px;text-transform:uppercase}
.field label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.field textarea,.field input{width:100%;background:var(--bg);border:1px solid var(--line);padding:10px;font-size:16px;outline:none;resize:vertical;color-scheme:dark}
.field textarea:focus,.field input:focus{border-color:var(--gold)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .danger{margin-left:auto;color:var(--mute)}
.hist{display:flex;flex-direction:column;gap:4px}
.hist div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist button{color:var(--mute);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.levelup{position:fixed;inset:0;background:rgba(11,11,12,.94);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:30;padding:30px}
.levelup.show{display:flex;animation:fade .3s}
.levelup .k{font-size:13px;letter-spacing:.3em;color:var(--mute);text-transform:uppercase}
.levelup .big{font-family:'Barlow Condensed';font-size:110px;line-height:1;color:var(--gold);margin-top:10px}
.levelup .nm{font-family:'Barlow Condensed';font-size:34px;text-transform:uppercase;margin-top:6px}
.levelup p{color:var(--mute);margin-top:14px;font-weight:300}
@keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1}}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--gold);color:var(--bg);padding:8px 14px;font-size:14px;letter-spacing:.06em;opacity:0;transition:.25s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.show{opacity:1}
.mountains{position:absolute;left:0;right:0;bottom:44px;height:60px;pointer-events:none}
.handle{position:absolute;right:20px;bottom:18px;color:var(--gold);font-size:13px;letter-spacing:.08em}
.ver{position:absolute;left:20px;bottom:18px;color:#3A3A3F;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.alert{display:block;width:100%;text-align:left;margin-top:14px;padding:11px 13px;border:1px solid var(--line);background:var(--panel);font-size:14px;line-height:1.4}
.alert.gold{border-color:var(--gold);color:var(--gold)}
.badges{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))!important}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 8px!important;opacity:1!important}
.badge .bsvg{width:62px;height:62px;margin-bottom:4px}
.badge b{font-size:12.5px!important}.badge:not(.on) b{color:var(--mute)}.badge:not(.on) span{opacity:.6}
.badge span{font-size:11px!important}
button.stage{width:100%;text-align:left}
.stage .nm small{display:block;font-size:11px;color:var(--gold);letter-spacing:.06em;text-transform:none;margin-top:3px}
.stage .ic{display:grid;place-items:center;font-size:14px}
.vol{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;align-items:end}
.vb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.vb small{font-size:10px;color:var(--mute);letter-spacing:.1em}
.bar2{height:70px;width:100%;background:#151517;display:flex;align-items:flex-end}
.bar2 div{width:100%;background:#4A4100}.bar2 div.cur{background:var(--gold)}
.box.rest{border:none;color:#3A3A3F;font-size:18px}
.hname small.m{color:var(--mute)}
.feed{margin-top:12px;display:flex;flex-direction:column}
.fe{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:300;line-height:1.4}
.fe b{font-weight:500}.fe span{float:right;color:var(--mute);font-size:12px;margin-left:10px}
.duel{margin-top:10px;background:var(--panel);border:1px solid var(--line);padding:14px}
.duel.over{opacity:.75}
.dh2{display:flex;justify-content:space-between;gap:8px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:10px}
.vs div{display:flex;flex-direction:column;gap:2px}.vs div:last-child{text-align:right}
.vs span{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.vs b{font-family:'Barlow Condensed';font-weight:400;font-size:30px}
.vs .win b{color:var(--gold)}
.vs i{font-style:normal;color:var(--mute);font-size:12px;letter-spacing:.2em}
.dform{display:flex;gap:6px;margin-top:10px}
.dform input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);padding:8px;font-size:15px;outline:none}
.wch{margin-top:16px;border:1px solid var(--gold);background:linear-gradient(135deg,rgba(255,193,7,.08),transparent 60%);padding:16px}
.wtag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.wn{font-family:'Barlow Condensed';font-size:28px;text-transform:uppercase;margin-top:6px;line-height:1.05}
.wch p{color:var(--mute);font-weight:300;font-size:14px;line-height:1.5;margin-top:8px}
.wopts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.wst{margin-top:12px;font-size:15px;line-height:1.45}
.wst b{color:var(--gold);font-weight:500}
.dice{transition:transform .2s}.dice.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.badgeup{position:fixed;inset:0;z-index:35;background:radial-gradient(circle at 50% 42%,rgba(255,193,7,.16),rgba(11,11,12,.97) 55%);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
.badgeup.show{display:flex;animation:fade .25s}
.bk{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);opacity:0;animation:up .5s .2s forwards}
.bstage{position:relative;width:220px;height:220px;margin-top:14px;display:grid;place-items:center}
.bimg{width:150px;height:150px;animation:badgeIn 1s cubic-bezier(.2,1.4,.35,1) both;filter:drop-shadow(0 0 0 rgba(255,193,7,0))}
.badgeup.show .bimg{animation:badgeIn 1s cubic-bezier(.2,1.4,.35,1) both,glow 2.4s 1s ease-in-out infinite}
.bimg svg{width:100%;height:100%}

/* ===================== v7 · design sportif ===================== */
:root{--bg:#09090A;--panel:#121214;--panel2:#19191C;--line:#25252A;--txt:#F5F5F3;--mute:#8A8A90;--gold:#FFC107;--goldsoft:rgba(255,193,7,.12)}
html,body{font-family:'Barlow',sans-serif}
body{background:var(--bg) url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22600%22%20height%3D%22600%22%20viewBox%3D%220%200%20600%20600%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-opacity%3D%22.035%22%20stroke-width%3D%221.2%22%3E%3Cpath%20d%3D%22M-20%20420C80%20360%20140%20400%20220%20350S360%20230%20460%20260%20590%20200%20640%20180%22/%3E%3Cpath%20d%3D%22M-20%20450C90%20390%20150%20430%20230%20380S370%20260%20470%20290%20600%20230%20640%20215%22/%3E%3Cpath%20d%3D%22M-20%20480C100%20420%20160%20460%20240%20410S380%20290%20480%20320%20610%20260%20640%20250%22/%3E%3Cpath%20d%3D%22M-20%20510C110%20450%20170%20490%20250%20440S390%20320%20490%20350%20620%20290%20640%20285%22/%3E%3Cellipse%20cx%3D%22420%22%20cy%3D%22140%22%20rx%3D%2270%22%20ry%3D%2238%22/%3E%3Cellipse%20cx%3D%22420%22%20cy%3D%22140%22%20rx%3D%22110%22%20ry%3D%2264%22/%3E%3Cellipse%20cx%3D%22420%22%20cy%3D%22140%22%20rx%3D%22150%22%20ry%3D%2292%22/%3E%3Cellipse%20cx%3D%22120%22%20cy%3D%22150%22%20rx%3D%2240%22%20ry%3D%2224%22/%3E%3Cellipse%20cx%3D%22120%22%20cy%3D%22150%22%20rx%3D%2275%22%20ry%3D%2246%22/%3E%3C/g%3E%3C/svg%3E") fixed;padding:0 0 calc(var(--nav) + 10px + env(safe-area-inset-bottom))}
.frame{border:none;max-width:760px;padding:0 18px 120px;min-height:auto;overflow:visible;overflow-x:clip}
.mountains{left:-18px;right:-18px;width:calc(100% + 36px)}
.frame.withadd{padding-bottom:210px}
.appbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:12px 0 14px;margin-bottom:8px;background:linear-gradient(var(--bg) 72%,rgba(9,9,10,0));}
.brand{display:flex;align-items:center;gap:9px}
.brand .brandlogo{height:46px;width:auto;display:block}
.brand b{font-family:'Barlow Condensed';font-style:italic;font-weight:900;font-size:23px;letter-spacing:.02em}
.lvchip{display:flex;align-items:center;gap:0;font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:14px;letter-spacing:.06em}
.lvchip span{background:var(--gold);color:#000;padding:4px 12px 4px 10px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.lvchip i{color:var(--mute);padding:4px 8px 4px 6px;font-style:italic}
h1{font-family:'Barlow Condensed';font-style:italic;font-weight:900;letter-spacing:-.005em;line-height:.86;font-size:clamp(54px,14vw,92px);margin-top:10px}
.tag{font-family:'Barlow Condensed';font-style:italic;font-weight:700;font-size:14px;letter-spacing:.16em;color:var(--mute)}
.tag::before{width:24px;height:4px;transform:skewX(-25deg)}
.sub{font-weight:400;font-size:15px;color:var(--mute)}
.anton{font-family:'Barlow Condensed'!important;font-style:italic;font-weight:900}
.label{font-family:'Barlow Condensed';font-weight:700;font-size:12.5px;letter-spacing:.14em}
.section-label{font-family:'Barlow Condensed';font-style:italic;font-weight:800;font-size:16px;letter-spacing:.1em;color:var(--txt);margin-top:34px}
.section-label::before{content:"//";color:var(--gold);font-weight:900;margin-right:2px}
.section-label::after{background:linear-gradient(90deg,var(--line),transparent)}
/* boutons et puces en biseau */
.btn,.chip,.subtab,.status{font-family:'Barlow Condensed';font-style:italic;font-weight:800;letter-spacing:.08em}
.btn{border:none;background:var(--panel2);padding:11px 20px;font-size:14.5px;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.96)}

.btn.main:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{padding:8px 15px;font-size:13px}
.chip{border:none;background:var(--panel2);font-size:13px;padding:7px 14px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
.chip.on{background:var(--gold);color:#000}
/* cartes à coin coupé */
.kpi,.stat,.panel,.row,.card,.perf,.duel,.wch,.stage,.badge,.sr,.alert,.empty,.add-in,.sheet{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.kpi{background:var(--panel);border:none;border-left:3px solid var(--gold);padding:13px 12px}

function habitStreak(id){const h=habits.find(x=>x.id===id);if(!h)return 0;let s=today(),c=0,guard=0;if(!(days[s]&&days[s].done[id]))s=addDays(s,-1);

    [[0,880],[.22,1175],[.44,1568],[.9,880],[1.12,1175],[1.34,1568]].forEach(([d,f])=>{const o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.value=f;
      g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.35,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+.2);o.connect(g);g.connect(c.destination);o.start(t0+d);o.stop(t0+d+.22)})}catch(_){}
    try{navigator.vibrate&&navigator.vibrate([400,120,400,120,700])}catch(_){}},
  async reg(){try{return navigator.serviceWorker?await navigator.serviceWorker.getRegistration():null}catch(_){return null}},

  if(TM.mode==="bloque"){try{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d)}catch(_){} try{history.pushState({focus:1},"")}catch(_){}}

  let hold=null,h0=0;const q=$("#fQuit"),qf=$("#fQf");

function tickTimer(){if(!TM)return;const left=Math.max(0,TM.dur-(Date.now()-TM.start)),sec=Math.ceil(left/1000);

function icsParse(txt){
  const L=txt.replace(/\r\n[ \t]/g,"").replace(/\n[ \t]/g,"").split(/\r?\n/),evs=[];let cur=null,depth=0;
  const val=l=>l.slice(l.indexOf(":")+1),un=v=>v.replace(/\\n/gi," ").replace(/\\([,;\\])/g,"$1");
  const dt=l=>{const v=val(l).trim(),isDate=/VALUE=DATE/.test(l)||/^\d{8}$/.test(v);
    if(isDate)return{d:`${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`,s:"",all:true};
    let D;if(v.endsWith("Z"))D=new Date(Date.UTC(+v.slice(0,4),+v.slice(4,6)-1,+v.slice(6,8),+v.slice(9,11),+v.slice(11,13)));
    else D=new Date(+v.slice(0,4),+v.slice(4,6)-1,+v.slice(6,8),+v.slice(9,11),+v.slice(11,13));
    return{d:ds(D),s:pad(D.getHours())+":"+pad(D.getMinutes()),all:false,D}};
  for(const l of L){
    if(l==="BEGIN:VEVENT"){cur={ex:[]};continue}
    if(/^BEGIN:/.test(l)&&cur){depth++;continue}if(/^END:/.test(l)&&cur&&depth&&l!=="END:VEVENT"){depth--;continue}
    if(l==="END:VEVENT"){if(cur&&cur.st&&cur.status!=="CANCELLED")evs.push(cur);cur=null;depth=0;continue}
    if(!cur||depth)continue;const k=l.split(/[;:]/)[0];
    if(k==="SUMMARY")cur.t=un(val(l)).slice(0,120);else if(k==="LOCATION")cur.loc=un(val(l)).slice(0,120);
    else if(k==="DTSTART")cur.st=dt(l);else if(k==="DTEND")cur.en=dt(l);else if(k==="RRULE")cur.rr=val(l);
    else if(k==="EXDATE")val(l).split(",").forEach(x=>cur.ex.push(dt("X:"+x).d));else if(k==="STATUS")cur.status=val(l).trim();
    else if(k==="RECURRENCE-ID")cur.rid=dt(l).d}
  // fenêtre : 30 jours avant → 6 mois après
  const from=addDays(today(),-30),to=addDays(today(),183),out=[],DAYS={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};
  const moved=new Set(evs.filter(e=>e.rid).map(e=>e.t+"|"+e.rid));
  for(const e of evs){const base={t:e.t||"(sans titre)",loc:e.loc||"",s:e.st.s,e:e.en&&!e.en.all?e.en.s:"",all:e.st.all};
    const dur=e.st.all&&e.en?Math.max(1,Math.round((parse(e.en.d)-parse(e.st.d))/864e5)):0;
    const push=d=>{if(d<from||d>to||e.ex.includes(d)||(!e.rid&&moved.has(e.t+"|"+d)))return;out.push({...base,d,...(dur>1?{end:addDays(d,dur)}:{})})};
    if(!e.rr){push(e.st.d);continue}
    const R={};e.rr.split(";").forEach(x=>{const [a,b]=x.split("=");R[a]=b});
    const iv=+(R.INTERVAL||1),cnt=R.COUNT?+R.COUNT:1e9,until=R.UNTIL?dt("X:"+R.UNTIL).d:"9999";
    let n=0;const st=e.st.d;
    for(let i=0;i<800&&n<cnt;i++){let ds_=[];
      if(R.FREQ==="DAILY")ds_=[addDays(st,i*iv)];
      else if(R.FREQ==="WEEKLY"){const wk0=addDays(st,-dow(st)),wk=addDays(wk0,i*7*iv);const by=(R.BYDAY||"").split(",").filter(Boolean).map(x=>(DAYS[x.slice(-2)]+6)%7);
        ds_=(by.length?by:[dow(st)]).sort().map(k=>addDays(wk,k)).filter(d=>d>=st)}
      else if(R.FREQ==="MONTHLY"){const D=parse(st);D.setMonth(D.getMonth()+i*iv);ds_=[ds(D)]}
      else if(R.FREQ==="YEARLY"){const D=parse(st);D.setFullYear(D.getFullYear()+i*iv);ds_=[ds(D)]}
      else{ds_=[st];i=800}
      let stop=false;for(const d of ds_){if(d>until||n>=cnt||d>to){stop=true;break}n++;push(d)}if(stop)break}}
  return out.sort((a,b)=>(a.d+a.s).localeCompare(b.d+b.s)).slice(0,1500)}
async function unzipIcs(buf){ // lit les .ics d'un zip (export google agenda)
  const v=new DataView(buf),u8=new Uint8Array(buf);let eocd=-1;for(let i=u8.length-22;i>=0;i--)if(v.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)throw new Error("zip illisible");let p=v.getUint32(eocd+16,true);const n=v.getUint16(eocd+10,true),out=[];
  for(let k=0;k<n;k++){const meth=v.getUint16(p+10,true),csz=v.getUint32(p+20,true),fl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.slice(p+46,p+46+fl));p+=46+fl+xl+cl;if(!/\.ics$/i.test(name))continue;

    if(meth===0)out.push(new TextDecoder().decode(data));

const GCAL="Google Calendar";
const GCOL={"1":"#7986CB","2":"#33B679","3":"#8E24AA","4":"#E67C73","5":"#F6BF26","6":"#F4511E","7":"#039BE5","8":"#616161","9":"#3F51B5","10":"#0B8043","11":"#D50000"};
async function loadWeek(wk,force){
  if(agLoading[wk]||(agWeeks[wk]&&!force))return;
  if(!force&&["nomcp","server_not_connected","not_in_manifest"].includes(agErr))return; // pas de google agenda : on ne redemande pas en boucle
  agLoading[wk]=true;agErr=null;
  try{
    if(!mcp)mcp=await claude.use("mcp");
    if(!mcp){agErr="nomcp";agWeeks[wk]=[];return}
    const out=[];let token;let guard=0;
    do{const r=await mcp.callTool(GCAL,"list_events",{startTime:wk+"T00:00:00",endTime:addDays(wk,7)+"T00:00:00",orderBy:"startTime",pageSize:250,...(token?{pageToken:token}:{})},{cache:force?{refresh:true,staleTime:120000,gcTime:600000}:{staleTime:120000,gcTime:600000}});
      const pl=r.payload||{};(pl.events||[]).forEach(e=>{if(e.status!=="cancelled")out.push(e)});token=pl.nextPageToken}while(token&&++guard<4);
    agWeeks[wk]=out.map(e=>{const sd=e.start||{},ed=e.end||{};const all=!!sd.date;
      return{id:e.id,t:e.summary||"(sans titre)",loc:e.location||"",d:all?sd.date:(sd.dateTime||"").slice(0,10),end:all?ed.date:(ed.dateTime||"").slice(0,10),s:all?"":(sd.dateTime||"").slice(11,16),e:all?"":(ed.dateTime||"").slice(11,16),all,c:GCOL[e.colorId]||"#FFC107",link:e.htmlLink||""}});
  }catch(e){agErr=(e&&e.code)||"erreur";if(!agWeeks[wk])agWeeks[wk]=[]}
  finally{agLoading[wk]=false;if(view==="agenda")render()}
}
function impEvOn(d){const o=[];myEv.forEach(doc=>{if(!doc.imported)return;(doc.events||[]).forEach((e,i)=>{if(e.d===d||(e.all&&e.end&&e.d<=d&&d<e.end))o.push({id:doc.id+"#"+i,t:e.t||"(sans titre)",loc:e.loc||"",d,end:d,s:e.s||"",e:e.e||"",all:!e.s,c:"#8ab4f8",imp:true})})});return o}
function myEvOn(d){return myEv.filter(e=>{if(!e.d||e.imported)return false;if(e.rep==="w"){if(d<e.d||(e.until&&d>e.until))return false;return Math.round((parse(d)-parse(e.d))/864e5)%7===0&&!(e.skip||[]).includes(d)}return e.d===d})
  .map(e=>({id:e.id,t:e.t||"(sans titre)",loc:e.loc||"",d,end:d,s:e.s||"",e:e.e||"",all:!e.s,c:e.c||"var(--gold)",own:true,rep:e.rep}))}

  h+=rows?`<div class="strava">${rows}</div>`:`<div class="empty"><b>pas encore de records</b>appuie sur « synchroniser strava », ou note tes chronos dans « renfo ».</div>`;
  return h;

function parsePerf(p,s){s=s.trim().replace(",",".");if(p.unit==="sec"){if(s.includes(":")){const [m,r]=s.split(":");return (+m)*60+(+r)}return +s}return +s}
async function syncStrava(){
  const msg=t=>{const m=$("#stravaMsg");if(m)m.textContent=t};
  syncing=true;render();
  try{
    if(!mcp) mcp=await claude.use("mcp");
    if(!mcp){syncing=false;render();msg("strava n'est pas accessible depuis ton compte ici : ajoute tes sorties avec « + sortie » et tes chronos dans « renfo ».");return}
    const r=await mcp.callTool("Strava","get_athlete_best_efforts",{sports:["Run","TrailRun"],best_effort_types:STRAVA_TYPES.map(x=>x[0])},{cache:false});
    const eff=(r.payload&&r.payload.efforts)||[];
    strava={efforts:eff,syncedAt:Date.now()};dset(P("strava","best"),strava);
    const from=addDays(today(),-42)+"T00:00:00";
    const a=await mcp.callTool("Strava","list_activities",{range_start:from,first:100},{cache:false});
    const acts=((a.payload&&a.payload.activities)||[]).filter(x=>["Run","TrailRun","VirtualRun","Hike"].includes(x.sport_type));
    let added=0,km=0;
    for(const x of acts){const id="s"+x.id;const doc={date:(x.start_local||"").slice(0,10),name:(x.name||"").slice(0,60),km:Math.round((x.summary&&x.summary.distance||0)/100)/10,dplus:Math.round(x.summary&&x.summary.elevation_gain||0),sport:x.sport_type,manual:false};
      const old=runs.find(r=>r.id===id);if(!old||old.km!==doc.km||old.dplus!==doc.dplus){dset(P("runs",id),doc);if(!old){added++;km+=doc.km}}}
    syncing=false;render();toast(added?`${added} sortie${added>1?"s":""} ajoutée${added>1?"s":""} · ${km.toFixed(1)} km`:"strava à jour");
    if(added)pushEvent(`a synchronisé ${km.toFixed(1).replace(".",",")} km de course`);
  }catch(e){
    const c=e&&e.code;syncing=false;render();
    msg(c==="server_not_connected"?"strava n'est pas connecté : ajoute-le dans claude.ai → réglages → connecteurs."
      :c==="needs_reauth"?"reconnecte strava dans claude.ai → réglages → connecteurs."
      :c==="not_in_manifest"||c==="approval_required"?"autorise strava pour cette page, puis réessaie."
      :c==="server_unavailable"?"strava ne répond pas, réessaie dans un moment."
      :c==="tool_error"?"strava a renvoyé une erreur : "+(e.message||"").slice(0,120)
      :"synchro impossible pour l'instant ("+(c||"erreur")+").");
  }finally{syncing=false}
}

   <div class="field"><label>distance (km)</label><input id="rKm" inputmode="decimal" placeholder="ex. 12,5"></div>

  if(b=q("[data-av]")){if(b.dataset.lock){toast(`🔒 se débloque au niveau ${b.dataset.lock}`);return}saveProfile({avatar:{...AV_DEF,...((meDoc&&meDoc.avatar)||{}),[b.dataset.av]:+b.dataset.i}});return}
  if(b=q("[data-mode]")){setMode(b.dataset.mode);saveProfile({mode:b.dataset.mode});return}
  if(b=q("[data-theme]")){if(!unlocked("theme"))return lockMsg("theme");saveProfile({theme:b.dataset.theme});document.documentElement.style.setProperty('--gold',b.dataset.theme);return}
  if(b=q("[data-tcreate]")){createTeam();return}
  if(b=q("[data-tjoin]")){joinTeam();return}
  if(b=q("[data-tleave]")){if(b.dataset.sure){setTeam("");toast("équipe quittée")}else{b.dataset.sure="1";b.textContent="sûr ? retape"}return}
  if(b=q("[data-tcopy]")){const c=(myBoard()||{}).teamId;try{navigator.clipboard.writeText(c).then(()=>toast("code copié"),()=>toast("code : "+c))}catch(_){toast("code : "+c)}return}
  if(b=q("[data-act]")){const x=items.find(i=>i.id===b.dataset.id);if(!x)return;const a=b.dataset.act;
    if(a==="toggle"){const d=!x.done;saveItem(x.id,{done:d,doneAt:d?Date.now():null});if(d)toast(`une de moins · +${XP.task+(x.prio?XP.taskPrio:0)} xp`)}
    if(a==="prio")saveItem(x.id,{prio:!x.prio});
    if(a==="status"){const i=(IDEA_STATUS.indexOf(x.status||"brute")+1)%IDEA_STATUS.length;saveItem(x.id,{status:IDEA_STATUS[i]});if(IDEA_STATUS[i]==="tournée")toast(`tournée ! +${XP.ideaShot} xp`)}
    if(a==="edit")openItem(x)}
});
$("#view").addEventListener("submit",e=>{const tf=e.target.closest("[data-trial]");if(tf){e.preventDefault();doTrial(tf.dataset.trial,tf.querySelector("input").value);return}
  const df=e.target.closest("[data-dscore]");if(df){e.preventDefault();scoreDuel(df.dataset.dscore,df.querySelector("input").value);return}
  const f=e.target.closest("[data-plog]");if(!f)return;e.preventDefault();
  const p=perfs.find(x=>x.id===f.dataset.plog),inp=f.querySelector("input"),v=parsePerf(p,inp.value);if(!v||isNaN(v)||v<=0){inp.value="";return}
  const prev=perfBest(p),rec=!prev||(p.lower?v<prev.v:v>prev.v);
  savePerf(p.id,{log:[...(p.log||[]),{d:today(),v}]});inp.value="";if(prev&&rec)pushEvent(`bat son record : ${p.name.toLowerCase()} ${fmtPerf(p,v)}`);toast(prev?(rec?`nouveau record !`:"noté — record toujours à "+fmtPerf(p,prev.v)):`premier test · +${XP.perfFirst} xp`)});

/* ================= SHEETS ================= */
document.addEventListener("change",e=>{if(e.target&&(e.target.id==="nfR"||e.target.id==="nfB")){const c=notifCfg();c.remind.time=$("#nfR").value||c.remind.time;c.bilan.time=$("#nfB").value||c.bilan.time;saveProfile({notif:c});toast("horaire enregistré")}});
function openSheet(html,bind){$("#sheet").innerHTML=html;$("#veil").classList.add("show");bind()}
function closeSheet(){$("#veil").classList.remove("show")}
$("#veil").addEventListener("click",e=>{if(e.target.id==="veil")closeSheet()});
function confirmDel(btn,fn){if(btn.dataset.sure){fn();closeSheet()}else{btn.dataset.sure="1";btn.textContent="sûr ? retape";btn.style.color="var(--gold)"}}
function chipPick(sel,cur,set){$(sel).onclick=e=>{const c=e.target.closest("[data-c]");if(!c)return;set(c.dataset.c);$(sel).querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",b.dataset.c===c.dataset.c))}}
function openItem(x){
  const isIdea=x.kind==="idea",cats=isIdea?IDEA_CATS:TASK_CATS;let cat=x.cat;
  openSheet(`<h2>${isIdea?"l'idée":"la tâche"}</h2>
    <div class="field"><label>texte</label><textarea id="eText" rows="2">${esc(x.text)}</textarea></div>
    <div class="field"><label>catégorie</label><div class="chips" id="eCats" style="margin-top:0">${cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>
    ${isIdea?"":`<div class="field"><label>échéance</label><input type="date" id="eDue" value="${esc(x.due||"")}"></div>`}
    <div class="field"><label>${isIdea?"détails, plans, chute…":"note"}</label><textarea id="eNote" rows="${isIdea?5:3}">${esc(x.note||"")}</textarea></div>
    <div class="actions"><button class="btn main" id="eSave">enregistrer</button>${isIdea?`<button class="btn" id="eToTask">en faire une tâche</button>`:""}<button class="btn ghost" id="eClose">fermer</button><button class="btn danger" id="eDel">supprimer</button></div>`,()=>{
    chipPick("#eCats",cat,v=>cat=v);
    $("#eSave").onclick=()=>{const d={text:$("#eText").value.trim().slice(0,500)||x.text,cat,note:$("#eNote").value.slice(0,4000)};if(!isIdea)d.due=$("#eDue").value||"";saveItem(x.id,d);closeSheet()};
    $("#eClose").onclick=closeSheet;$("#eDel").onclick=e=>confirmDel(e.target,()=>delItem(x.id));
    if(isIdea)$("#eToTask").onclick=()=>{saveItem(newId(),{kind:"task",text:x.text,cat:"Insta",done:false,prio:false,due:"",note:x.note||"",createdAt:Date.now(),doneAt:null},true);if((x.status||"brute")==="brute")saveItem(x.id,{status:"à creuser"});closeSheet();toast("ajoutée aux tâches")};
  });
}
function openHabit(h,isNew){
  let tmin=(h.timer&&h.timer.min)||0,tmode=(h.timer&&h.timer.mode)||"bloque";
  let slot=h.slot||"matin";let hd=Array.isArray(h.days)&&h.days.length?[...h.days]:[0,1,2,3,4,5,6];
  openSheet(`<h2>${isNew?"nouvelle habitude":"l'habitude"}</h2>
    <div class="field"><label>nom</label><input id="hName" value="${esc(h.name||"")}" placeholder="ex. 50 pompes"></div>
    <div class="field"><label>moment</label><div class="chips" id="hSlot" style="margin-top:0">${SLOTS.map(([k,l])=>`<button class="chip ${k===slot?"on":""}" data-c="${k}">${l}</button>`).join("")}</div></div>
    <div class="field"><label>jours</label><div class="chips" id="hDays" style="margin-top:0">${"LMMJVSD".split("").map((d,i)=>`<button class="chip ${hd.includes(i)?"on":""}" data-d="${i}" style="min-width:38px">${d}</button>`).join("")}</div></div>
    <div class="field"><label>minuteur intégré</label><div class="chips" id="hTm" style="margin-top:0">${[0,2,5,10,15,20,25,30,45,60].map(m=>`<button class="chip ${m===tmin?"on":""}" data-c="${m}">${m?m+" min":"aucun"}</button>`).join("")}</div>
      <div class="chips" id="hTmM" style="margin-top:8px">${[["bloque","🔒 bloqué"],["libre","📱 libre (autre appli)"]].map(([k,l])=>`<button class="chip ${k===tmode?"on":""}" data-c="${k}">${l}</button>`).join("")}</div>
      <p class="sub" style="font-size:12px;margin:6px 0 0">bloqué : plein écran, sortir de l'appli = séance ratée. libre : pour une appli comme Duolingo, le temps tourne même si tu changes d'appli.</p></div>
    ${isNew?"":`<div class="field"><label>position dans la liste</label><div class="actions"><button class="btn small" id="hUp">↑ monter</button><button class="btn small" id="hDown">↓ descendre</button></div><p class="sub" style="margin:6px 0 0;font-size:13px">change sa place parmi tes habitudes du même moment.</p></div>`}
    <div class="actions"><button class="btn main" id="hSave">enregistrer</button><button class="btn ghost" id="hClose">fermer</button>${isNew?"":`<button class="btn danger" id="hDel">supprimer</button>`}</div>`,()=>{
    chipPick("#hSlot",slot,v=>slot=v);chipPick("#hTm",String(tmin),v=>tmin=+v);chipPick("#hTmM",tmode,v=>tmode=v);
    $("#hDays").onclick=e=>{const c=e.target.closest("[data-d]");if(!c)return;const i=+c.dataset.d;hd=hd.includes(i)?hd.filter(x=>x!==i):[...hd,i].sort();if(!hd.length)hd=[i];c.classList.toggle("on",hd.includes(i))};
    $("#hSave").onclick=()=>{const name=$("#hName").value.trim().slice(0,60);if(!name)return;
      if(isNew){const mx=Math.max(0,...habits.map(x=>x.order||0));saveHabit(newId(),{name,slot,days:hd.length===7?[]:hd,order:mx+1,createdAt:Date.now(),archived:false,timer:tmin?{min:tmin,mode:tmode}:null},true)}
      else saveHabit(h.id,{name,slot,days:hd.length===7?[]:hd,timer:tmin?{min:tmin,mode:tmode}:null});closeSheet()};
    $("#hClose").onclick=closeSheet;
    if(!isNew){
      $("#hDel").onclick=e=>confirmDel(e.target,()=>delHabit(h.id));
      const move=dir=>{const sib=activeHabits().filter(x=>x.slot===h.slot);const i=sib.findIndex(x=>x.id===h.id),j=i+dir;if(j<0||j>=sib.length)return;
        const a=sib[i],b=sib[j],oa=a.order||0,ob=b.order||0;saveHabit(a.id,{order:ob===oa?ob+dir:ob});saveHabit(b.id,{order:oa})};
      $("#hUp").onclick=()=>move(-1);$("#hDown").onclick=()=>move(1);
    }
  });
}
function openPerf(p,isNew){
  let unit=p.unit||"reps", lower=!!p.lower;
  const hist=[...(p.log||[])].sort((a,b)=>b.d.localeCompare(a.d));
  openSheet(`<h2>${isNew?"nouvel exercice":esc(p.name)}</h2>
    <div class="field"><label>nom</label><input id="pName" value="${esc(p.name||"")}" placeholder="ex. tractions max"></div>
    <div class="field"><label>meilleur résultat</label><div class="chips" id="pLow" style="margin-top:0"><button class="chip ${!lower?"on":""}" data-c="0">plus haut = mieux</button><button class="chip ${lower?"on":""}" data-c="1">plus bas = mieux (chrono)</button></div></div>
    <div class="field"><label>unité</label><div class="chips" id="pUnit" style="margin-top:0">${[["reps","répétitions"],["sec","temps (min:s)"],["kg","kg"]].map(([k,l])=>`<button class="chip ${k===unit?"on":""}" data-c="${k}">${l}</button>`).join("")}</div></div>
    ${hist.length?`<div class="field"><label>historique</label><div class="hist">${hist.map((e,i)=>`<div><span>${fdate(e.d,{day:"numeric",month:"short",year:"numeric"})}</span><b class="g">${fmtPerf(p,e.v)}</b><button data-hdel="${i}">retirer</button></div>`).join("")}</div></div>`:""}
    <div class="actions"><button class="btn main" id="pSave">enregistrer</button><button class="btn ghost" id="pClose">fermer</button>${isNew?"":`<button class="btn danger" id="pDel">supprimer</button>`}</div>`,()=>{
    chipPick("#pUnit",unit,v=>unit=v);chipPick("#pLow",lower,v=>lower=v==="1");
    $("#pSave").onclick=()=>{const name=$("#pName").value.trim().slice(0,40);if(!name)return;
      if(isNew){const mx=Math.max(0,...perfs.map(x=>x.order||0));savePerf(newId(),{name,unit,order:mx+1,log:[],lower},true)}else savePerf(p.id,{name,unit,lower});closeSheet()};
    $("#pClose").onclick=closeSheet;
    if(!isNew)$("#pDel").onclick=e=>confirmDel(e.target,()=>delPerf(p.id));
    $("#sheet").querySelectorAll("[data-hdel]").forEach(b=>b.onclick=()=>{const e=hist[+b.dataset.hdel];const log=(p.log||[]).filter(x=>x!==e);savePerf(p.id,{log});closeSheet();openPerf(perfs.find(x=>x.id===p.id))});
  });
}
const badgeQ=[];let badgeShowing=false;
function queueBadge(b){badgeQ.push(b);if(!badgeShowing)nextBadge()}
function nextBadge(){if(badgeQ.length)SND.badge();
  const b=badgeQ.shift();const el=$("#badgeup");if(!b){badgeShowing=false;el.classList.remove("show");return}
  badgeShowing=true;
  const sparks=[...Array(16)].map((_,i)=>{const a=i/16*Math.PI*2,d=110+Math.random()*60;return `<i style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;animation-delay:${.45+Math.random()*.15}s"></i>`}).join("");
  el.innerHTML=`<div class="bk">badge débloqué</div><div class="bstage"><div class="rays"></div><div class="sparks">${sparks}</div><div class="bimg">${badgeSvg(b.i,true,b.t)}</div></div>
   <div class="bn">${esc(b.n)}</div><div class="bd">${esc(b.d)}</div><button class="btn main">${badgeQ.length?"suivant":"continuer"}</button>`;
  el.classList.remove("show");void el.offsetWidth;el.classList.add("show");
  el.querySelector("button").onclick=nextBadge;
}
function showLevelUp(L){SND.level();const el=$("#levelup");const st=stageOf(L),newStage=STAGES.some(s=>s[0]===L);const rw=newStage&&meDoc&&meDoc.rewards&&meDoc.rewards[L];
  setTimeout(()=>pushEvent(`passe niveau ${L}${newStage?" · "+st:""}`),0);
  el.innerHTML=`<div class="lulogo">${LOGO}</div><div class="k">niveau supérieur</div><div class="big">${L}</div><div class="nm">${newStage?"nouveau palier · ":""}${st}</div>${rw?`<p style="color:var(--gold);font-size:18px">🎁 tu as gagné : ${esc(rw)}</p>`:""}<p>${L<MAX_LEVEL?`encore ${MAX_LEVEL-L} niveaux avant ${curLg>0?"le sommet de la ligue":"les Alpes"}.`:curLg<LEAGUES.length-1?`les alpes sont à toi. prochaine étape : la ligue ${LEAGUES[curLg+1]}.`:"t'es arrivé. du plat aux alpes."}</p><button class="btn main" style="margin-top:26px">continuer</button>`;
  el.classList.add("show");el.querySelector("button").onclick=()=>el.classList.remove("show")}

/* ================= BOOT ================= */
const h0=(location.hash||"").slice(1);if(NAV.some(n=>n[0]===h0)||MENU_VIEWS.includes(h0))view=h0;
render();banner("connexion à ton QG…");
(async()=>{
  try{db=await claude.use("db")}catch(_){db=null}
  if(!db){banner("ton QG n'est pas joignable ici (ouvre-le sur claude.ai, connecté) : rien ne sera sauvegardé.");return}
  try{userApi=await claude.use("user")}catch(_){userApi=null}
  if(userApi){owner=await userApi.isOwner();uid=await userApi.id();if(uid){try{profiles=await userApi.profiles([uid])}catch(_){}}}
  if(!owner&&!uid){banner("impossible de t'identifier : demande au créateur du QG de t'inviter par e-mail (rôle éditeur), puis recharge.");return}
  const timer=setTimeout(()=>banner("le QG met du temps à charger… il s'affichera dès que possible."),10000);
  const done=()=>{if(allLoaded()){clearTimeout(timer);banner(readOnly?"lecture seule : demande un accès éditeur pour pouvoir cocher.":"")}};
  const fail=err=>{clearTimeout(timer);banner(err&&err.code==="revoked"?"accès retiré.":"connexion perdue — recharge la page plus tard.")};
  const colRef=name=>owner?db.collection(name):db.doc(`data/users/${uid}/me`).collection(name);
  const sub=(name,cb,ref)=>(ref||colRef(name)).onSnapshot(snap=>{cb(snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})));if(!snap.metadata.fromCache)loaded[name]=true;done();render()},fail);
  sub("items",a=>items=a);
  sub("habits",a=>habits=a);
  sub("days",a=>{days={};a.forEach(d=>days[d.id]={done:d.done||{},off:!!d.off})});
  sub("perfs",a=>perfs=a);
  sub("strava",a=>{const b=a.find(d=>d.id==="best");strava=b||null});
  sub("profile",a=>{meDoc=a.find(d=>d.id==="me")||null});
  sub("runs",a=>runs=a);
  sub("agenda",a=>myEv=a);
  if(uid){
    sub("board",a=>{board=a;if(!eventsInit){events=(a.find(b=>b.id===uid)||{}).events||[];eventsInit=true}},db.collection("board"));
    sub("nudges",a=>nudges=a,db.collection("nudges"));
    sub("challenges",a=>challenges=a,db.collection("challenges"));
    sub("teams",a=>teams=a,db.collection("teams"));
    if(owner)sub("bugs",a=>inbox=a,db.collection("bugs"));
  }
})();
